name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node --test expands the test/**/*.test.ts glob itself (Node 21+).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
